<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#56d4dd"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d29922"/>
    </marker>
    <marker id="arrowRose" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f778ba"/>
    </marker>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="sramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d1f17"/>
    </linearGradient>
    <linearGradient id="psramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2815"/>
      <stop offset="100%" stop-color="#1a180d"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a222a"/>
      <stop offset="100%" stop-color="#0d131a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">ESP32-S3 記憶體階層：參數的居住地決定一切</text>

  <!-- Chip boundary -->
  <rect x="60" y="60" width="680" height="520" rx="16" fill="url(#chipGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- SRAM Region -->
  <rect x="100" y="100" width="600" height="110" rx="10" fill="url(#sramGrad)" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="130" y="130" fill="#2ea043" font-size="14" font-weight="700">SRAM — 512KB，240 MB/s 頻寬</text>
  <text x="130" y="155" fill="#7ee787" font-size="12">Dense Core（思考核心）</text>
  <text x="130" y="175" fill="#e6edf3" font-size="13" font-weight="600">559K 參數 · 每個 token 都會用到</text>
  <text x="130" y="198" fill="#8b949e" font-size="11">Attention + FFN 矩陣乘法 · 推論的「熱路徑」</text>

  <!-- Arrow SRAM→計算 -->
  <line x1="400" y1="210" x2="400" y2="240" stroke="#2ea043" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Compute block -->
  <rect x="280" y="242" width="240" height="36" rx="8" fill="#1a2a38" stroke="#56d4dd" stroke-width="1.5"/>
  <text x="400" y="265" text-anchor="middle" fill="#56d4dd" font-size="13" font-weight="600">矩陣乘法引擎（雙核）</text>

  <!-- Arrow 計算→PSRAM -->
  <line x1="400" y1="278" x2="400" y2="310" stroke="#d29922" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- PSRAM Region -->
  <rect x="100" y="310" width="600" height="100" rx="10" fill="url(#psramGrad)" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="130" y="340" fill="#d29922" font-size="14" font-weight="700">PSRAM — 8MB，60.7 MB/s 頻寬</text>
  <text x="130" y="363" fill="#e6edf3" font-size="13" font-weight="600">Output Head 1.64MB · KV Cache</text>
  <text x="130" y="385" fill="#f778ba" font-size="11">⚠ 瓶頸在此：head 計算佔每個 token 時間的 55%</text>

  <!-- Arrow PSRAM→Flash (PLE lookup) -->
  <path d="M400,410 L400,440" stroke="#56d4dd" stroke-width="1.5" marker-end="url(#arrowCyan)" stroke-dasharray="4,3"/>
  <text x="410" y="435" fill="#56d4dd" font-size="10">每 token 只讀 ~450 bytes</text>

  <!-- FLASH Region -->
  <rect x="100" y="445" width="600" height="115" rx="10" fill="url(#flashGrad)" stroke="#56d4dd" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="130" y="475" fill="#56d4dd" font-size="14" font-weight="700">FLASH — 16MB，隨機讀取 512B ≈ 20.3 µs</text>
  <text x="130" y="498" fill="#7ee787" font-size="12">PLE Per-Layer Embeddings 查表</text>
  <text x="130" y="518" fill="#e6edf3" font-size="13" font-weight="600">25M 參數（14.9MB 量化後）· 6 層 × 詞彙表 32768</text>
  <text x="130" y="540" fill="#8b949e" font-size="11">查表成本僅佔每個 token 時間的 ~0.7% — 幾乎免費</text>

  <!-- Arrow back FLASH→計算 -->
  <path d="M250,502 Q200,502 200,420 Q200,300 270,260" stroke="#56d4dd" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)" stroke-dasharray="4,3"/>
  <text x="130" y="450" fill="#56d4dd" font-size="10">6 rows lookup result</text>

  <!-- Legend -->
  <rect x="520" y="100" width="250" height="85" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="540" y="122" fill="#8b949e" font-size="10" font-weight="600">圖例</text>
  <rect x="540" y="132" width="12" height="12" rx="2" fill="#2ea043"/>
  <text x="560" y="142" fill="#8b949e" font-size="10">SRAM · 核心計算</text>
  <rect x="540" y="152" width="12" height="12" rx="2" fill="#d29922"/>
  <text x="560" y="162" fill="#8b949e" font-size="10">PSRAM · Head / Cache</text>
  <rect x="540" y="172" width="12" height="12" rx="2" fill="#56d4dd"/>
  <text x="560" y="182" fill="#8b949e" font-size="10">FLASH · PLE 查表</text>

  <!-- Bottom stats -->
  <text x="400" y="575" text-anchor="middle" fill="#8b949e" font-size="11">最終效能：9.5 tok/s · 模型大小 14.9MB · 晶片成本 $8 · 完全離線</text>
</svg>
