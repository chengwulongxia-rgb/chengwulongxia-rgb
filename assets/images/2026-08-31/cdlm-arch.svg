<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <rect width="960" height="360" fill="#0d1117"/>
  <text x="24" y="44" fill="#e6edf3" font-size="17" font-weight="600">三種序列生成框架：(a) 自迴歸 (b) 離散擴散 (c) 連續擴散</text>

  <!-- (a) autoregressive -->
  <g transform="translate(24,70)">
    <rect x="0" y="0" width="290" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="26" fill="#e6edf3" font-size="14" font-weight="600">(a) 自迴歸 AR</text>
    <rect x="12" y="40" width="40" height="34" rx="6" fill="#3d6ea5"/>
    <rect x="58" y="40" width="40" height="34" rx="6" fill="#3d6ea5"/>
    <rect x="104" y="40" width="40" height="34" rx="6" fill="#3d6ea5"/>
    <rect x="150" y="40" width="40" height="34" rx="6" fill="#1f6feb" opacity="0.5"/>
    <path d="M 32 78 V 210" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 78 78 V 210" stroke="#8b949e" stroke-width="1.5" fill="none"/>
    <path d="M 124 78 V 210" stroke="#8b949e" stroke-width="1.5" fill="none"/>
    <rect x="12" y="150" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="58" y="150" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="104" y="150" width="40" height="34" rx="6" fill="#58a6ff"/>
    <text x="28" y="172" fill="#0d1117" font-size="12" text-anchor="middle">前</text>
    <text x="74" y="172" fill="#0d1117" font-size="12" text-anchor="middle">前</text>
    <text x="120" y="172" fill="#0d1117" font-size="12" text-anchor="middle">前</text>
    <!-- attention to next -->
    <path d="M 130 187 C 160 205 150 205 180 190" stroke="#e6edf3" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="170" y="242" fill="#8b949e" font-size="12">一次一個 token，依序生成</text>
  </g>

  <!-- (b) discrete diffusion -->
  <g transform="translate(340,70)">
    <rect x="0" y="0" width="290" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="26" fill="#e6edf3" font-size="14" font-weight="600">(b) 離散擴散 DDLM（masked）</text>
    <rect x="12" y="46" width="40" height="34" rx="6" fill="#ececec" opacity="0.35"/>
    <rect x="58" y="46" width="40" height="34" rx="6" fill="#ececec" opacity="0.35"/>
    <rect x="104" y="46" width="40" height="34" rx="6" fill="#ececec" opacity="0.35"/>
    <rect x="150" y="46" width="40" height="34" rx="6" fill="#ececec" opacity="0.35"/>
    <text x="188" y="68" fill="#8b949e" font-size="12">全部遮罩</text>
    <path d="M 32 84 V 120 M 78 84 V 120 M 124 84 V 120 M 170 84 V 120" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="12" y="126" width="40" height="34" rx="6" fill="#ececec" opacity="0.35"/>
    <rect x="58" y="126" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="104" y="126" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="150" y="126" width="40" height="34" rx="6" fill="#ececec" opacity="0.35"/>
    <text x="206" y="148" fill="#8b949e" font-size="12">逐步揭開</text>
    <path d="M 32 164 V 200 M 124 164 V 200" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="12" y="204" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="58" y="204" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="104" y="204" width="40" height="34" rx="6" fill="#58a6ff"/>
    <rect x="150" y="204" width="40" height="34" rx="6" fill="#58a6ff"/>
    <text x="28" y="226" fill="#0d1117" font-size="12" text-anchor="middle">乙</text>
    <text x="120" y="226" fill="#0d1117" font-size="12" text-anchor="middle">乙</text>
    <text x="28" y="246" fill="#8b949e" font-size="12">token 層級做離散雜訊</text>
  </g>

  <!-- (c) continuous diffusion -->
  <g transform="translate(656,70)">
    <rect x="0" y="0" width="280" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="26" fill="#e6edf3" font-size="14" font-weight="600">(c) 連續擴散 CDLM</text>
    <circle cx="80" cy="70" r="40" fill="#1f6feb" opacity="0.25"/>
    <text x="80" y="75" fill="#58a6ff" font-size="12" text-anchor="middle">embedding 空間</text>
    <text x="80" y="92" fill="#8b949e" font-size="11" text-anchor="middle">高斯雜訊</text>
    <!-- points -->
    <circle cx="50" cy="52" r="5" fill="#3fb950"/>
    <circle cx="104" cy="48" r="5" fill="#3fb950"/>
    <circle cx="88" cy="92" r="5" fill="#d29922"/>
    <circle cx="56" cy="84" r="5" fill="#3fb950"/>
    <!-- denoise arrows -->
    <path d="M 20 120 C 40 150 90 150 120 130" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="30" y="160" fill="#e6edf3" font-size="12">去噪器逐一收回</text>
    <text x="30" y="176" fill="#e6edf3" font-size="12">雜訊、逼近離散 token</text>
    <!-- discretize -->
    <path d="M 60 190 V 210" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="36" y="210" width="34" height="28" rx="6" fill="#58a6ff"/>
    <rect x="78" y="210" width="34" height="28" rx="6" fill="#3fb950"/>
    <rect x="48" y="232" fill="#e6edf3"/>
    <text x="130" y="232" fill="#8b949e" font-size="11">末端離散化（clamp）</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e6edf3"/>
    </marker>
  </defs>
</svg>